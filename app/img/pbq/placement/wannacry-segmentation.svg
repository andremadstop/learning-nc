<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">WannaCry Segmentierungsdiagramm</title>
  <desc id="desc">Netzwerkdiagramm fuer Firewall und VLAN-Platzierung mit Client-, Server- und Quarantaene-Segment.</desc>
  <rect width="960" height="560" rx="28" fill="#10161d"/>
  <rect x="40" y="40" width="880" height="480" rx="24" fill="#0d1219" stroke="#2d3f52" stroke-width="2"/>
  <rect x="90" y="215" width="165" height="130" rx="20" fill="#162535" stroke="#58b7ff" stroke-width="3"/>
  <rect x="345" y="95" width="215" height="145" rx="22" fill="#132435" stroke="#73d2ff" stroke-width="3"/>
  <rect x="345" y="320" width="215" height="145" rx="22" fill="#16212e" stroke="#73d2ff" stroke-width="3"/>
  <rect x="680" y="200" width="195" height="160" rx="22" fill="#28181b" stroke="#f87171" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M255 280H345M560 170H680M560 390H680" stroke="#66b8ff" stroke-width="6" stroke-linecap="round"/>
  <text x="172" y="255" fill="#dcecff" font-family="JetBrains Mono, monospace" font-size="24" text-anchor="middle">Internet-Edge</text>
  <text x="172" y="286" fill="#66b8ff" font-family="JetBrains Mono, monospace" font-size="18" text-anchor="middle">Slot A</text>
  <text x="452" y="150" fill="#dcecff" font-family="JetBrains Mono, monospace" font-size="24" text-anchor="middle">Client VLAN</text>
  <text x="452" y="181" fill="#66b8ff" font-family="JetBrains Mono, monospace" font-size="18" text-anchor="middle">Slot B</text>
  <text x="452" y="375" fill="#dcecff" font-family="JetBrains Mono, monospace" font-size="24" text-anchor="middle">Server VLAN</text>
  <text x="452" y="406" fill="#66b8ff" font-family="JetBrains Mono, monospace" font-size="18" text-anchor="middle">Slot C</text>
  <text x="777" y="255" fill="#ffd4d4" font-family="JetBrains Mono, monospace" font-size="22" text-anchor="middle">Quarantäne</text>
  <text x="777" y="286" fill="#ff9696" font-family="JetBrains Mono, monospace" font-size="18" text-anchor="middle">Slot D</text>
  <text x="777" y="315" fill="#fca5a5" font-family="JetBrains Mono, monospace" font-size="14" text-anchor="middle">Laterale Bewegung blockieren</text>
</svg>
