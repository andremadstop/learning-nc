  <text x="480" y="158" fill="#dcecff" font-family="JetBrains Mono, monospace" font-size="22" text-anchor="middle">Sensor-Zone</text>
  <text x="480" y="188" fill="#66b8ff" font-family="JetBrains Mono, monospace" font-size="18" text-anchor="middle">Slot B</text>
  <text x="480" y="380" fill="#dcecff" font-family="JetBrains Mono, monospace" font-size="24" text-anchor="middle">Core</text>
  <text x="480" y="410" fill="#66b8ff" font-family="JetBrains Mono, monospace" font-size="18" text-anchor="middle">Slot C</text>
  <text x="790" y="248" fill="#dcecff" font-family="JetBrains Mono, monospace" font-size="24" text-anchor="middle">Remote Access</text>
  <text x="790" y="284" fill="#66b8ff" font-family="JetBrains Mono, monospace" font-size="18" text-anchor="middle">Slot D</text>
