name: E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "30 2 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_CONTAINER: learning-app
      DB_CONTAINER: learning-db
      E2E_BASE_URL: http://localhost:8080/apps/learning
      E2E_USERNAME: admin
      E2E_PASSWORD: admin
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Verify Node runtime
        run: |
          node -v
          npm -v

      - name: Start Nextcloud stack
        run: docker compose up -d

      - name: Fix Nextcloud permissions
        run: |
          docker exec learning-app sh -lc '
            mkdir -p /var/www/html/apps /var/www/html/config /var/www/html/data
            chown -R www-data:www-data /var/www/html/apps /var/www/html/config /var/www/html/data
          '

      - name: Fix workspace permissions for npm
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          chmod -R u+rwX "$GITHUB_WORKSPACE/app"

      - name: Wait for Nextcloud
        run: bash scripts/e2e/wait-nextcloud.sh

      - name: Re-apply app dir permissions after init
        run: |
          docker exec learning-app sh -lc '
            mkdir -p /var/www/html/apps
            chown -R www-data:www-data /var/www/html/apps
            chmod -R u+rwX,g+rwX /var/www/html/apps
          '

      - name: Disable App Store in CI (avoid apps write check in occ)
        run: |
          docker exec learning-app php -r '
            $cfgFile = "/var/www/html/config/config.php";
            if (!file_exists($cfgFile)) { exit(0); }
            $CONFIG = [];
            include $cfgFile;
            if (!is_array($CONFIG)) { $CONFIG = []; }
            $CONFIG["appstoreenabled"] = false;
            $out = "<?php\n\\$CONFIG = " . var_export($CONFIG, true) . ";\n";
            file_put_contents($cfgFile, $out);
          '
          docker exec learning-app php occ status --output=json

      - name: Install app dependencies
        run: npm --prefix app ci

      - name: Build frontend
        run: npm --prefix app run build

      - name: Install Playwright browser
        run: npx --prefix app playwright install --with-deps chromium

      - name: Seed E2E fixtures
        run: bash scripts/e2e/seed-fixtures.sh

      - name: Run E2E tests
        run: |
          set -a
          source app/tests/e2e/.env.generated
          set +a
          npm --prefix app run test:e2e:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker logs learning-app || true
          docker logs learning-db || true
