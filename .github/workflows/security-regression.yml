name: Security Regression

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for security anti-patterns
        run: |
          FAIL=0
          echo "=== Security Regression Checks ==="

          # No eval() in PHP
          if grep -rn 'eval(' app/lib/ --include="*.php" 2>/dev/null; then
            echo "FAIL: eval() found in PHP"
            FAIL=1
          fi

          # No raw SQL without parameterized queries
          if grep -rn 'query("' app/lib/ --include="*.php" 2>/dev/null | grep -v 'executeQuery\|executeStatement\|getQueryBuilder'; then
            echo "FAIL: raw SQL query found"
            FAIL=1
          fi

          # No v-html (XSS risk) — exception: explicit eslint-disable-next-line vue/no-v-html on preceding line
          VHTML_VIOLATIONS=$(python3 -c "
import glob, sys
violations = []
for f in glob.glob('app/src/**/*.vue', recursive=True):
    lines = open(f).readlines()
    for i, line in enumerate(lines):
        if ' v-html' in line and 'eslint-disable' not in line:
            prev = lines[i-1] if i > 0 else ''
            if 'eslint-disable-next-line' not in prev or 'vue/no-v-html' not in prev:
                violations.append(f'{f}:{i+1}: {line.rstrip()}')
for v in violations: print(v)
")
          if [ -n "\$VHTML_VIOLATIONS" ]; then
            echo "\$VHTML_VIOLATIONS"
            echo "FAIL: v-html found without explicit security approval (XSS risk)"
            FAIL=1
          fi

          # No hardcoded credentials
          if grep -rn 'password.*=.*["\x27][^"\x27]' app/lib/ --include="*.php" 2>/dev/null | grep -v 'getPassword\|setPassword\|password_hash\|password_verify\|userId\|phpstan\|TODO\|FIXME'; then
            echo "WARN: possible hardcoded credential"
          fi

          if [ $FAIL -eq 0 ]; then
            echo "All security checks passed"
          else
            exit 1
          fi

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
