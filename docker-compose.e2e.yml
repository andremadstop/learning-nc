# Local Gate-3 stack for the Playwright E2E tests (app/tests/e2e/README.md).
# Keeps Nextcloud bootstrap isolated from the learning app source tree.
# Images pinned to the same digests as scripts/gate-container.sh and scripts/lifecycle-probe.sh.
services:
  db:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    container_name: learning-db
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
    networks:
      - learning-net

  app:
    image: nextcloud:33@sha256:293744abb460e5e1b07a3bd730a687003d1e0c45bdce6645e3c54075e83479ae
    container_name: learning-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - nextcloud_data:/var/www/html
      # disables the App Store during bootstrap (see the file and app/tests/e2e/README.md)
      - ./scripts/e2e/nextcloud-config/zz-e2e.config.php:/var/www/html/config/zz-e2e.config.php:ro
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    depends_on:
      - db
    networks:
      - learning-net

volumes:
  db_data:
    driver: local
  nextcloud_data:
    driver: local

networks:
  learning-net:
    driver: bridge
